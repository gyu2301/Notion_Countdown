<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700|Montserrat:900">
  <title>Countdown Timer</title>

  <style>
    body {
      background-color: white;
    }

    #timer {
      color: #eeeeee;
      text-align: center;
      text-transform: uppercase;
      font-family: 'Lato', sans-serif;
      font-size: .7em;
      letter-spacing: 5px;
    }

    .days, .hours, .minutes, .seconds {
      display: inline-block;
      padding: 20px;
      width: 100px;
      border-radius: 5px;
      margin: 5px;
    }

    .days {
      background: #00462A;
    }

    .hours {
      background: #00462A;
      color: #FFFDF1;
    }

    .minutes {
      background: #00462A;
    }

    .seconds {
      background: #00462A;
    }

    .numbers {
      font-family: 'Montserrat', sans-serif;
      color: #FFFDF1;
      font-size: 4em;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="timer">
    <div class="days">
      <div id="days" class="numbers"></div>
      days
    </div>

    <div class="hours">
      <div id="hours" class="numbers"></div>
      hours
    </div>

    <div class="minutes">
      <div id="minutes" class="numbers"></div>
      minutes
    </div>

    <div class="seconds">
      <div id="seconds" class="numbers"></div>
      seconds
    </div>
  </div>

  <script>
    function getTargetDate() {
      const now = new Date();
      let targetDate = new Date(now.getFullYear(), 10, 23, 0, 0, 0);

      // JavaScript에서 월은 0부터 시작합니다.
      // 0 = January, 10 = November

      if (now > targetDate) {
        targetDate = new Date(now.getFullYear() + 1, 10, 23, 0, 0, 0);
      }

      return targetDate;
    }

    function updateTimer() {
      const today = new Date().getTime();
      const targetDate = getTargetDate().getTime();

      const diff = targetDate - today;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
